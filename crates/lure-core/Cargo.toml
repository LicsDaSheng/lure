[package]
name = "lure-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust 版 nanobot 复刻的核心领域库（Phase 0 骨架）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
regex = "1"
ureq = "2"
tungstenite = "0.26"
uuid = { version = "1", features = ["v4"] }
serde_yaml = "0.9.34"
sha1 = "0.11.0"
# 异步运行时（Stage 0）：为 AgentLoop.run 调度核心（Stage 1）与全 IO 面异步化铺路。
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "signal", "process"] }
futures = "0.3"
# 异步 trait 与 HTTP 客户端（Stage 2）：provider/turn 异步化。
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
# WebUI server（Stage 3）：axum 统一 HTTP + WS。
axum = { version = "0.8", features = ["ws", "json", "macros"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3"
