[package]
name = "lure-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lure desktop：内嵌 WebUI 的桌面应用（wry webview + 进程内 HTTP/WS 能力）"

[[bin]]
name = "lure-desktop"
path = "src/main.rs"

[dependencies]
lure-core = { path = "../lure-core" }
lure-cli = { path = "../lure-cli" }
serde_json = "1"
wry = "0.55.1"
tao = "0.35.3"
rust-embed = "8.12.0"
muda = "0.19.3"

[dev-dependencies]
ureq = "2"
tempfile = "3"
tungstenite = "0.26"
