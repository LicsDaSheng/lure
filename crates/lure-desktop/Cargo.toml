[package]
name = "lure-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lure desktop：内嵌 WebUI 的桌面应用（Tauri V2 外壳 + 进程内 HTTP/WS 能力）"

[[bin]]
name = "lure-desktop"
path = "src/main.rs"

[dependencies]
lure-core = { path = "../lure-core" }
lure-cli = { path = "../lure-cli" }
serde_json = "1"
rust-embed = "8.12.0"
tauri = { version = "2", features = [] }
# 异步运行时（Stage 0）：main 入口创建 tokio runtime，为 AgentLoop.run 常驻调度铺路。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# 异步 trait（Stage 4）：BusyTurnRunner 包装 TurnRunner 标记活跃 session。
async-trait = "0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
ureq = "2"
tempfile = "3"
tungstenite = "0.26"
