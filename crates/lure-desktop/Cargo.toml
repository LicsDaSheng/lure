[package]
name = "lure-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lure desktop：内嵌 WebUI 的桌面应用（Tauri V2 外壳 + 进程内 HTTP/WS 能力）"

[[bin]]
name = "lure-desktop"
path = "src/main.rs"

[dependencies]
lure-core = { path = "../lure-core" }
lure-cli = { path = "../lure-cli" }
serde_json = "1"
rust-embed = "8.12.0"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
ureq = "2"
tempfile = "3"
tungstenite = "0.26"
