[workspace]
members = ["crates/lure-desktop", "crates/lure-pty"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
async-channel = "2"
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98", package = "gpui-ce", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "f388375d03e63d75811fa1cca3a563203b920d98", package = "gpui_ce_platform", features = ["font-kit"] }
image = { version = "0.25", default-features = false }
rio-graphics = { version = "0.5.32", default-features = false }
rio-vt = { version = "0.5.32", default-features = false, features = ["graphics"] }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
