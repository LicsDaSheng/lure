# Lure 本地容器编排（Phase 11 骨架）。
# 当前 CLI 为一次性入口，service 以 `--version` 作为构建 smoke；
# 常驻 gateway 服务命令随真实 HTTP/WebSocket 服务落地后再补。

services:
  lure:
    build:
      context: .
      dockerfile: Dockerfile
    image: lure:local
    # 持久化 workspace（config / sessions / memory）。
    volumes:
      - lure-data:/home/lure/.nanobot
    # 构建冒烟：打印版本。替换为常驻服务命令时改这里。
    command: ["--version"]

volumes:
  lure-data:
