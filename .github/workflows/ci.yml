name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "handbook/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - "handbook/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 门禁（fmt + clippy + test）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（stable + rustfmt/clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 格式校验
        run: cargo fmt --all --check

      - name: Clippy 静态检查
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 全量测试
        # 不设置 DEEPSEEK_API_KEY：provider_deepseek_smoke 是 opt-in 真实网络测试，
        # CI 保持离线、确定性。
        run: cargo test --all-targets --all-features

  frontend:
    name: 前端构建（React WebUI）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2

      - name: 安装依赖
        working-directory: frontend/app
        run: bun install --frozen-lockfile

      - name: 构建
        working-directory: frontend/app
        run: bun run build

  e2e:
    name: E2E 契约测试（Playwright + headless lure-desktop）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri V2 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2

      - name: 安装 E2E 依赖（bun + Chromium）
        run: |
          cd e2e && bun install --frozen-lockfile
          cd e2e && bunx playwright install --with-deps chromium

      - name: 运行 E2E
        run: cd e2e && bun run e2e

  docker:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像
        run: docker build -t lure:test .

      - name: 验证镜像入口
        run: docker run --rm lure:test --version
