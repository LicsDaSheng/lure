name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 快速门禁：无 GUI 依赖的核心/CLI crate（Linux）。
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt（全 workspace，仅格式不编译）
        run: cargo fmt --all --check
      - name: clippy（lure-core + lure-cli）
        run: cargo clippy -p lure-core -p lure-cli --all-targets --all-features -- -D warnings
      - name: test（lure-core + lure-cli）
        run: cargo test -p lure-core -p lure-cli --all-targets --all-features

  # 全量门禁：lure-desktop（wry 需 WebKit，macOS 自带免 apt）+ 真实浏览器 E2E 契约测试。
  desktop-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      - name: clippy（lure-desktop）
        run: cargo clippy -p lure-desktop --all-targets -- -D warnings
      - name: test（lure-desktop headless 集成测试）
        run: cargo test -p lure-desktop --all-targets

      - name: 安装前端依赖（vendored WebUI）
        working-directory: frontend/webui
        run: bun install --frozen-lockfile
      - name: 安装 E2E 依赖
        working-directory: e2e
        run: bun install
      - name: 安装 Playwright Chromium
        working-directory: e2e
        run: bunx playwright install chromium

      - name: 运行 E2E 契约 smoke
        working-directory: e2e
        # webServer 自动：构建 frontend/dist → 起 lure-desktop --headless --model echo。
        # CI=true（GitHub 自动注入）→ Playwright 不复用既有 server、forbidOnly 生效。
        run: bun run e2e

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
