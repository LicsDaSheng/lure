name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    name: 构建 ${{ matrix.name }} 安装包
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            glob: target/**/release/bundle/dmg/*.dmg
            artifact: lure-macos-arm64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            glob: target/**/release/bundle/nsis/*.exe
            artifact: lure-windows-x86_64
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            glob: target/**/release/bundle/deb/*.deb
            artifact: lure-linux-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Tauri V2 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 添加 Rust target
        run: rustup target add ${{ matrix.target }}

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2

      - name: 安装前端依赖
        working-directory: frontend/app
        run: bun install --frozen-lockfile

      - name: 构建前端
        working-directory: frontend/app
        run: bun run build

      - name: 打包安装包
        # @tauri-apps/cli 与 Rust tauri 2.x 配套；--bundles 覆盖 tauri.conf.json 的 targets。
        working-directory: crates/lure-desktop
        run: bunx @tauri-apps/cli@^2 build --bundles ${{ matrix.bundles }} --target ${{ matrix.target }}

      - name: 上传安装包
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

      - name: 上传 Linux AppImage
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v5
        with:
          name: lure-linux-x86_64-appimage
          path: target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: build-installers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: 整理产物并生成校验和
        run: |
          mkdir -p out
          find artifacts -name "*.dmg" -exec cp {} out/lure-macos-arm64.dmg \;
          find artifacts -name "*.exe" -exec cp {} out/lure-windows-x86_64.exe \;
          find artifacts -name "*.deb" -exec cp {} out/lure-linux-x86_64.deb \;
          find artifacts -name "*.AppImage" -exec chmod +x {} \; -exec cp {} out/lure-linux-x86_64.AppImage \;
          ls -la out
          (cd out && sha256sum * > checksums.txt)

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes
